name: Fork I18n Translate

# Fills missing values-<lang> strings through the Maestro gateway (OpenAI-compatible).
# Needs the repository secret MAESTRO_TOKEN. Optional variable MAESTRO_ENDPOINT overrides the gateway URL.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch that receives the translations
        required: true
        default: i18n/translations
      langs:
        description: Android locale qualifiers, comma separated (tr,de,pt-rBR)
        required: true
        default: tr
      model:
        description: Model id on the gateway
        required: true
        default: gemini-3.5-flash-lite
      max_ratio:
        description: Max length of a translation relative to the English text
        required: true
        default: "1.2"
      limit:
        description: Max keys per language (empty = all)
        required: false
        default: ""

concurrency:
  group: fork-i18n-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        path: tools
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        path: target
    - name: Build i18n-fill
      working-directory: tools/.github/fork-tools/i18n-fill
      run: cargo build --release --locked
    - name: Translate
      env:
        MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        ENDPOINT: ${{ vars.MAESTRO_ENDPOINT || 'https://claudflaree-worker.pulsariums.workers.dev/maestro/v1' }}
        LANGS: ${{ inputs.langs }}
        MODEL: ${{ inputs.model }}
        MAX_RATIO: ${{ inputs.max_ratio }}
        LIMIT: ${{ inputs.limit }}
      run: |
        if [ -z "$MAESTRO_TOKEN" ]; then echo "::error::Repository secret MAESTRO_TOKEN is not set"; exit 2; fi
        ARGS=(--res target/app/src/main/res --langs "$LANGS" --endpoint "$ENDPOINT" --model "$MODEL" --max-ratio "$MAX_RATIO")
        if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
        tools/.github/fork-tools/i18n-fill/target/release/i18n-fill "${ARGS[@]}"
    - name: Commit and push
      working-directory: target
      env:
        LANGS: ${{ inputs.langs }}
        MODEL: ${{ inputs.model }}
        REF: ${{ inputs.ref }}
      run: |
        git add app/src/main/res
        if git diff --cached --quiet; then echo "Nothing translated"; exit 0; fi
        git -c user.name=pulsarium -c user.email=pulsariums@gmail.com commit -m "i18n: fill missing strings ($LANGS)" -m "Machine translated with $MODEL, placeholders and length checked by i18n-fill."
        git push origin "HEAD:$REF"
