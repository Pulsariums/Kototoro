name: tmp i18n append
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/desktop-languages
      - name: Append missing pt-BR keys
        run: |
          cat >> desktop-app/src/main/resources/i18n/desktop-strings_pt-BR.properties <<'PROPS'
          screens.tagBlacklist=Tags bloqueadas
          sources.overview=Visão geral
          sources.sort.default=Ordem de instalação
          sources.sort.title=Título
          sources.sort.language=Idioma
          sources.sort.custom=Ordem personalizada
          sources.reorderSummary=Mova uma linha para cima ou para baixo e depois salve a sequência
          sources.wizardSummary=Conheça o que são repositórios, extensões e fontes e depois escolha o tema da interface
          sources.reorderEmpty=Nenhuma fonte habilitada para reordenar
          sources.wizardAppearanceSummary=Escolha aqui o tema, o estilo da interface e o idioma da interface; a página de configurações altera esses mesmos três depois
          sources.remote=Fontes remotas
          sources.jarPriorityNote=Tem efeito na próxima vez que o aplicativo iniciar.
          sources.adult=Conteúdo adulto
          sources.nsfwFilter=Ocultar conteúdo 18+
          sources.nsfwFilterSummary=Telas que ignoram fontes e obras adultas
          sources.nsfw.sources=Fontes e exploração
          sources.nsfw.favourites=Favoritos
          sources.nsfw.history=Histórico
          sources.nsfw.updates=Novidades
          sources.nsfw.bookmarks=Marcadores e notas
          sources.adultNote=As recomendações mantêm sua própria opção 18+.
          sources.tags=Tags
          sources.tagBlacklistNote=O Android lê a mesma seleção: IDs de taxonomia, sinônimos e padrões “raw:” correspondem exatamente.
          sources.tagBlacklistClear=Limpar
          sources.tagBlacklistAddPattern=Adicionar “%s”
          sources.tagBlacklistKey=Chave: %s
          sources.tagBlacklistEnglish=Inglês: %s
          sources.tagBlacklistCategory=Categoria: %s
          sources.tagBlacklistAliases=Sinônimos: %s
          settings.sourcesSaveFailed=Não foi possível salvar as configurações das fontes
          storage.moreSummary=Uso de armazenamento e proxy
          storage.database=Banco de dados
          storage.images=Imagens
          storage.imagesProtected=Imagens · %1$s mantidos pelos capítulos salvos
          storage.preferences=Preferências e downloads
          storage.logs=Logs
          storage.other=Outros
          storage.volume=Tamanho do volume
          video.decoder.hardwareOnly=Somente decodificação por hardware; um arquivo que a GPU não consegue decodificar falha em vez de usar a CPU
          video.decoder.hardwarePreferred=Decodificação por hardware com alternativa por software quando a GPU não consegue decodificar o arquivo
          video.decoder.softwarePreferred=Decodificação por software para todos os arquivos
          playback.moreSummary=Fundo de reprodução, decodificador e opacidade dos controles
          error.videoSettingsInMemory=As configurações de reprodução foram aplicadas, mas não puderam ser salvas no disco
          replaceRules.loading=Lendo as regras…
          replaceRules.filter=Arquivos de regras (JSON)
          replaceRules.importFailed=O arquivo não é uma lista de regras de substituição
          replaceRules.exported=Regras exportadas para %s
          replaceRules.exportFailed=Não foi possível exportar as regras
          dictionaryRules.loading=Lendo as regras de dicionário…
          dictionaryRules.filter=Arquivos de regras de dicionário (JSON)
          dictionaryRules.saved=Regra de dicionário salva
          dictionaryRules.deleted=Regra de dicionário excluída
          dictionaryRules.imported=%d regras de dicionário importadas
          dictionaryRules.importFailed=O arquivo não é uma lista de regras de dicionário
          dictionaryRules.exported=Regras de dicionário exportadas para %s
          dictionaryRules.exportFailed=Não foi possível exportar as regras de dicionário
          downloadsSettings.title=Configurações de download
          downloadsSettings.moreSummary=Páginas paralelas, séries simultâneas, intervalo entre requisições e tentativas
          downloadsSettings.parity=Apenas a parte que o Windows consegue cumprir
          downloadsSettings.parityDetail=As linhas do Android sobre rede móvel, otimização de bateria, qualidade de vídeo, ilustrações de romance e diretório de conteúdo pertencem a recursos de plataforma que o Windows não tem, então esta página edita os números de velocidade e de tentativas que a fila offline realmente lê.
          error.downloadSettingsInMemory=As configurações de download estão ativas, mas não puderam ser salvas no disco
          navSettings.moreSummary=Quais destinos a barra lateral mostra e em que ordem
          navSettings.position=%1$d de %2$d
          navSettings.morePinned=Mais fica sempre por último
          navSettings.morePinnedDetail=É a única entrada para todas as outras páginas, por isso não pode ser reordenada, ocultada nem listada aqui.
          navSettings.cap=O Android mantém o mesmo limite de %1$d destinos; remover o último traz Início de volta.
          error.navSettingsInMemory=A lista de navegação está ativa, mas não pôde ser salva no disco
          feed.readCompleted=Lido
          feed.pendingChapters=%s capítulos não lidos
          feed.updatesAvailable=Novidades de capítulos disponíveis
          feed.sourceTime=Fonte atualizada: %s
          feed.sourceTimeUnknown=Data de atualização da fonte desconhecida
          feed.sourceTimePartial=Algumas datas desconhecidas
          feed.chapterDetails=Detalhes do capítulo
          extensions.testSourcesSummary=Pedir a cada fonte habilitada uma lista, uma capa, detalhes, capítulos, páginas e um resultado de busca
          sourceTest.intro=Cada fonte recebe o pedido de uma lista principal, três capas, os detalhes da primeira obra, seus capítulos, as páginas do primeiro capítulo e um resultado de busca. Uma fonte que responde “não compatível” em uma etapa é ignorada em vez de falhar; a etapa aleatória do Android não tem operação no Windows e não é executada.
          sourceTest.steps=%1$d fontes habilitadas serão testadas, três por vez.
          sourceTest.results=Resultados (%1$d)
          sourceTest.empty=Nada foi testado ainda nesta visita.
          sourceTest.stepCount=%1$d etapas
          sourceTest.copied=Os resultados estão na área de transferência como JSON
          sourceTest.copyFailed=A área de transferência recusou os resultados; nada foi copiado
          sourceTest.disabledFailed=%1$d fontes com falha foram desabilitadas e removidas da barra de fontes
          sourceTest.nothingFailed=Nenhuma fonte falhou, então não há nada para desabilitar
          extensions.add=Adicionar
          extensions.addHint=Adicione um repositório ou link de configuração de fonte, ou importe um arquivo de extensão local.
          extensions.repositoryType=Repositório de extensões
          extensions.available=Disponível
          extensions.localFileHint=Importe um JAR, APK, plugin Cloudstream ou uma configuração JSON do TVBox ou Legado. O formato do arquivo é detectado automaticamente.
          extensions.localFileFilter=Extensões e configurações de fontes
          extensions.findRepository=Buscar repositórios
          extensions.repositoriesEmpty=Ainda não há repositórios. Adicione um para descobrir extensões e fontes.
          extensions.noResults=Nenhum resultado correspondente
          extensions.repositorySources=%d fontes
          extensions.removeSourceRepository=Remover %s?
          extensions.removeSourceRepositoryHint=Remova esta configuração e suas %d fontes. Itens da biblioteca, histórico e downloads são mantidos.
          extensions.browseRepository=Explorar
          extensions.sourcesEmpty=Ainda não há fontes. Adicione um repositório ou importe uma extensão para começar.
          history.daysAgo=há %d dias
          PROPS
      - name: Commit
        run: |
          git config user.name pulsarium
          git config user.email pulsariums@gmail.com
          git add -A
          git commit -m 'Continue Brazilian Portuguese desktop catalog'
          git push origin HEAD:i18n/desktop-languages
