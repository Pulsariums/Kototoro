name: tmp-yama
# Gecici: tmp-yama/*.patch dosyalarini uygular, kendini ve yamalari siler.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devel
      - run: |
          set -e
          for p in tmp-yama/*.patch; do git apply --verbose "$p"; done
          git rm -rq tmp-yama .github/workflows/tmp-yama.yml
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add -A
          git commit -qm 'fix(sources): kaynak satiri kurulamayan kaynak listeden sessizce dusmez, hatasiyla gorunur'
          git push -q origin HEAD:devel
