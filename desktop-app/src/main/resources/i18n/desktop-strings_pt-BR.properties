reader.shortcutsHelp=← / → página\nPageUp / PageDown página ou rolagem\nHome / End primeira e última página\nB adiciona ou remove um marcador\nArraste para virar a página (primeiro mova a imagem quando houver zoom)\nO botão “Auto” na parte de baixo vira páginas ou rola, e pausa por 2 segundos ao interagir\nToque à esquerda ou à direita para virar a página, toque no meio para mostrar ou ocultar a barra de ferramentas (altere em “Ações ao tocar”)\nPressionar e segurar ou clicar com o botão direito executa a ação de toque longo (por padrão abre as configurações de leitura no meio)\nA roda vira páginas (rola quando houver zoom)\nCtrl + roda aplica zoom\nH mostra ou oculta a barra de ferramentas\nF11 tela cheia\nEsc fecha o painel ou volta aos detalhes
